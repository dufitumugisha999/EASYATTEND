<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>EASYATTEND | Smart Attendance Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.0.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <iconify-icon icon="ph:users-three-duotone" width="24" height="24"></iconify-icon>
          </div>
          <div class="brand-text">
            <span class="brand-name">EasyAttend</span>
            <span class="brand-subtitle">Rwanda</span>
          </div>
        </div>
      </div>
      
      <nav class="nav-menu">
        <div class="nav-section-title">Main</div>
        <a class="nav-link active" data-view="dashboard">
          <iconify-icon icon="ph:squares-four-duotone" width="20" height="20"></iconify-icon>
          <span>Dashboard</span>
        </a>
        <a class="nav-link" data-view="attendance">
          <iconify-icon icon="ph:calendar-blank-duotone" width="20" height="20"></iconify-icon>
          <span>Attendance</span>
        </a>
        <a class="nav-link" data-view="people">
          <iconify-icon icon="ph:address-book-duotone" width="20" height="20"></iconify-icon>
          <span>Directory</span>
        </a>
        <a class="nav-link" data-view="register">
          <iconify-icon icon="ph:user-circle-plus-duotone" width="20" height="20"></iconify-icon>
          <span>Register</span>
        </a>
        
        <div class="nav-section-title">Insights</div>
        <a class="nav-link" data-view="analytics">
          <iconify-icon icon="ph:chart-pie-duotone" width="20" height="20"></iconify-icon>
          <span>Analytics</span>
        </a>
        <a class="nav-link" data-view="reports">
          <iconify-icon icon="ph:article-duotone" width="20" height="20"></iconify-icon>
          <span>Reports</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="theme-switch" id="themeToggle">
          <iconify-icon icon="ph:moon-duotone" width="18" height="18" id="themeIcon"></iconify-icon>
          <span>Dark mode</span>
        </div>
        <div class="user-card">
          <div class="user-avatar">AK</div>
          <div class="user-details">
            <span class="user-name">Admin Karenzi</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile toggle -->
    <button class="menu-toggle" id="menuToggle">
      <iconify-icon icon="ph:list-duotone" width="24" height="24"></iconify-icon>
    </button>

    <!-- Main Content -->
    <main class="main-area" id="mainContent">
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <p>Loading your workspace...</p>
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modalRoot"></div>
  
  <!-- Toast Container -->
  <div id="toastRoot"></div>

  <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>EASYATTEND | AI-Powered Attendance Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.0.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <iconify-icon icon="ph:calendar-check-duotone" width="28" height="28"></iconify-icon>
        </div>
        <span class="logo-text">EASYATTEND</span>
      </div>
      
      <nav class="nav-section">
        <div class="nav-label">Main Menu</div>
        <button class="nav-item active" data-view="dashboard">
          <iconify-icon icon="ph:circles-four-duotone" width="22" height="22"></iconify-icon>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="attendance">
          <iconify-icon icon="ph:calendar-check-duotone" width="22" height="22"></iconify-icon>
          <span>Attendance</span>
          <span class="nav-badge" id="pendingBadge">0</span>
        </button>
        <button class="nav-item" data-view="people">
          <iconify-icon icon="ph:users-duotone" width="22" height="22"></iconify-icon>
          <span>People</span>
        </button>
        <button class="nav-item" data-view="register">
          <iconify-icon icon="ph:user-plus-duotone" width="22" height="22"></iconify-icon>
          <span>Register</span>
        </button>
        
        <div class="nav-label">Analytics</div>
        <button class="nav-item" data-view="analytics">
          <iconify-icon icon="ph:chart-bar-duotone" width="22" height="22"></iconify-icon>
          <span>Analytics</span>
        </button>
        <button class="nav-item" data-view="reports">
          <iconify-icon icon="ph:file-text-duotone" width="22" height="22"></iconify-icon>
          <span>Reports</span>
        </button>
        
        <div class="nav-label">Settings</div>
        <button class="nav-item" data-view="settings">
          <iconify-icon icon="ph:gear-duotone" width="22" height="22"></iconify-icon>
          <span>Settings</span>
        </button>
      </nav>

      <div class="user-profile">
        <div class="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name">Admin User</div>
          <div class="user-role">Super Admin</div>
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle theme">
          <iconify-icon icon="ph:moon-duotone" width="20" height="20" id="themeIcon"></iconify-icon>
        </button>
      </div>
    </aside>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <iconify-icon icon="ph:list-duotone" width="24" height="24"></iconify-icon>
    </button>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p class="loading-text">Loading EASYATTEND...</p>
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modalContainer"></div>
  
  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Firebase SDK -->
  <script type="module" src="app.js"></script>
</body>
</html>
